plugins {
    id "com.android.application"
}

android {
    namespace "com.mingeonhee.myframeworkmobile"
    compileSdk 35
    ndkVersion "27.2.12479018"

    defaultConfig {
        applicationId "com.mingeonhee.myframeworkmobile"
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                abiFilters "arm64-v8a", "x86_64"
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // 로컬 테스트용 (스토어 배포 시 교체)
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
            buildStagingDirectory file("${System.getenv('LOCALAPPDATA')}/MyFrameworkMobileCxx")
        }
    }
}

// 원본 엔진과 같은 경로("../../Resource/..." → "Resource/...")로 읽을 수 있게 저장소 루트의 리소스 / 셰이더를 APK assets 로 복사한다.
def frameworkRoot = file("../..")
def generatedAssets = layout.buildDirectory.dir("generated/frameworkAssets")

tasks.register("copyFrameworkAssets", Sync) {
    from(frameworkRoot) {
        include "Resource/**", "Shader/**", "Engine/Shader/**", "Game/Shader/**"
    }
    into generatedAssets
}

android.sourceSets.main.assets.srcDirs += generatedAssets
preBuild.dependsOn "copyFrameworkAssets"
