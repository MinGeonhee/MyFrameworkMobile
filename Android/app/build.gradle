plugins {
    id "com.android.application"
}

android {
    namespace "com.mingeonhee.myframeworkmobile"
    compileSdk 35
    ndkVersion "27.2.12479018"

    defaultConfig {
        applicationId "com.mingeonhee.myframeworkmobile"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -Wall -Wextra"
                abiFilters "arm64-v8a", "x86_64"
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
            buildStagingDirectory file("${System.getenv('LOCALAPPDATA')}/MyFrameworkMobileCxx")
        }
    }
}
